name: Import card thumbnails

on:
  push:
    paths:
      - 'scripts/import-card-thumbnails.mjs'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-card-thumbnails.mjs
      - name: Verify
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('thumbnails.json','utf8'));
          for (const id of ['81556098422773','91389584710674','139426020484277']) {
            if (!String(t[id]||'').startsWith('https://tr.rbxcdn.com/')) throw new Error(id+' missing CDN thumbnail');
          }
          const html=fs.readFileSync('index.html','utf8');
          if (!html.includes("search.addEventListener('input'")) throw new Error('search fix missing');
          if (!html.includes('HP ${compact(getHealth(card))}')) throw new Error('card stats missing');
          console.log('Thumbnail import and page checks passed.');
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbnails.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Import card thumbnails"
            git push
          fi
