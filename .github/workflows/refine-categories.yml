name: Refine categories

on:
  push:
    paths:
      - 'scripts/refine-categories.mjs'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refine-categories.mjs
      - name: Check page script syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const s=h.split('<script>')[1].split('</script>')[0];
          fs.writeFileSync('/tmp/page.js',s);
          NODE
          node --check /tmp/page.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Refine card categories" && git push; fi
